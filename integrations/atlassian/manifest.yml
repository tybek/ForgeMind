modules:
  jira:globalPage:
    - key: forgemind-atlassian-companion-page
      resource: main
      resolver:
        function: publication-mapping
      render: native
      title: ForgeMind Atlassian Companion
  function:
    - key: publication-mapping
      handler: backend/index.handler
resources:
  - key: main
    path: src/frontend/index.tsx
permissions:
  scopes:
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/02c0bfd7-96e0-42d6-b63c-a78858d136ad
  compatibility:
    jira:
      required: true
    confluence:
      required: false
