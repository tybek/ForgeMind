[package]
name = "forgemind"
version = "0.1.0"
description = "ForgeMind AI Game Development Workspace"
authors = ["ForgeMind contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "forgemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
